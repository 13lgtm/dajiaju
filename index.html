<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>酷家乐 · 大家居营销助手</title>
  <style>
    :root {
      --brand: #1A56DB;
      --brand-dark: #1444B5;
      --brand-light: #EBF2FF;
      --bg-page: #EEF2F7;
      --bg-app: #F5F7FA;
      --card: #FFFFFF;
      --text-1: #1D2129;
      --text-2: #4E5969;
      --text-3: #86909C;
      --border: #E5E6EB;
      --green: #07C160;
      --green-bg: #E8FFEA;
      --orange: #FF7D00;
      --orange-bg: #FFF7E8;
      --red: #F53F3F;
      --red-bg: #FFECE8;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); background: var(--bg-page); color: var(--text-1); font-size: 13.5px; line-height: 1.45; min-height: 100vh; }
    button, input, select, textarea { font-family: inherit; outline: none; }
    button { cursor: pointer; border: none; background: none; transition: all .15s; }
    button:active { transform: scale(.98); }

    /* Top Demo Bar */
    .demo-bar {
      position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; gap: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .demo-brand { display: flex; align-items: center; gap: 8px; }
    .demo-logo { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .seg { display: inline-flex; background: var(--bg-app); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
    .seg-btn { padding: 4px 9px; border-radius: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .seg-btn.active { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .ind-seg { background: var(--brand-light); border-color: #C3D9FF; }
    .ind-seg .seg-btn.active { background: var(--brand); color: #fff; }
    .anom-btn { padding: 4px 8px; border-radius: 6px; font-size: 11.5px; background: #fff; border: 1px solid var(--border); color: var(--text-2); }
    .anom-btn.active { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); font-weight: 600; }
    .shot-btn { background: var(--brand-light); border: 1px solid #C3D9FF; color: var(--brand); font-weight: 600; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; }

    /* Stage & Phone Frame */
    .stage { display: flex; justify-content: center; padding: 20px 12px 36px; }
    .phone {
      width: 390px; max-width: 100%; height: 780px; background: var(--bg-app); border-radius: 42px;
      border: 9px solid #1D2129; box-shadow: 0 24px 56px rgba(15,28,56,.18);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    /* WeChat Chrome */
    .wx-top { background: #fff; border-bottom: 1px solid #F2F3F5; flex-shrink: 0; z-index: 10; }
    .wx-status { height: 28px; padding: 6px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 600; }
    .wx-nav { height: 42px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; position: relative; }
    .wx-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 600; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wx-capsule { width: 76px; height: 26px; border-radius: 13px; border: 1px solid rgba(0,0,0,.14); display: flex; align-items: center; justify-content: space-evenly; font-size: 12px; color: #1D2129; }
    .wx-cap-div { width: 1px; height: 13px; background: rgba(0,0,0,.15); }
    .viewport { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
    .viewport::-webkit-scrollbar { width: 3px; }
    .viewport::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }

    /* Bottom Tabbar */
    .tabbar { height: 56px; background: #fff; border-top: 1px solid var(--border); display: flex; flex-shrink: 0; padding-bottom: 4px; }
    .tabbar.hidden { display: none; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; color: var(--text-3); position: relative; }
    .tab-btn.active { color: var(--brand); font-weight: 600; }
    .tab-badge { position: absolute; top: 3px; right: calc(50% - 20px); background: var(--red); color: #fff; font-size: 9.5px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

    /* Common UI */
    .pad { padding: 12px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card { background: #fff; border-radius: var(--radius); padding: 12px; border: 1px solid #F0F1F5; box-shadow: 0 2px 6px rgba(0,0,0,.03); }
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .b-blue { background: var(--brand-light); color: var(--brand); }
    .b-orange { background: var(--orange-bg); color: var(--orange); }
    .b-green { background: var(--green-bg); color: #009A29; }
    .b-red { background: var(--red-bg); color: var(--red); }
    .b-gray { background: var(--bg-app); color: var(--text-2); border: 1px solid var(--border); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .btn-sm { padding: 5px 9px; font-size: 11.5px; border-radius: 6px; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-wechat { background: var(--green); color: #fff; }
    .btn-outline { background: #fff; color: var(--brand); border: 1px solid #BDD2FF; }
    .btn-ghost { background: var(--bg-app); color: var(--text-2); border: 1px solid var(--border); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger-out { background: #fff; color: var(--red); border: 1px solid #FCDCDA; }
    .btn[disabled] { opacity: .45; pointer-events: none; }

    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; }
    .chip { padding: 4px 10px; border-radius: 99px; font-size: 11.5px; background: #fff; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
    .chip.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .chip.q { background: var(--bg-app); }
    .chip.q.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); font-weight: 600; }

    /* Plan Card */
    .plan-card { background: #fff; border-radius: var(--radius); overflow: hidden; border: 1px solid #ECEEF2; box-shadow: 0 2px 8px rgba(0,0,0,.04); cursor: pointer; }
    .plan-body { padding: 10px 12px 11px; }
    .plan-title { font-weight: 700; font-size: 14px; line-height: 1.35; margin-bottom: 7px; }
    .plan-meta { font-size: 10.5px; color: var(--text-3); flex: 1; min-width: 0; }
    .plan-img { position: relative; height: 146px; background: #E9EEF5; overflow: hidden; }
    .plan-img svg { width: 100%; height: 100%; display: block; }
    .img-tags { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; }
    .t-3d { background: rgba(26,86,219,.9); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
    .t-hot { background: linear-gradient(90deg,#FF7D00,#F53F3F); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
    .t-local { background: rgba(29,33,41,.75); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
    .t-pin { background: rgba(7,193,96,.92); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
    .grp-hd { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--text-2); }
    .grp-hd::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .trace-box { font-size: 11.5px; color: #0F5132; background: #EAF7EF; border: 1px solid #C6E9D4; padding: 6px 8px; border-radius: 6px; line-height: 1.55; }
    .conv-row { display: flex; gap: 8px; margin-top: 9px; }
    .conv-row > div { flex: 1; background: var(--bg-app); border-radius: 8px; padding: 7px 4px; text-align: center; }
    .conv-row b { display: block; font-size: 16px; color: var(--text-1); line-height: 1.3; }
    .conv-row span { font-size: 10.5px; color: var(--text-3); }

    /* P2 Hero & Pano */
    .hero { position: relative; height: 224px; background: #1E2532; overflow: hidden; user-select: none; }
    .hero svg { width: 100%; height: 100%; display: block; }
    .enter-3d { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(26,86,219,.92); border: 1.5px solid rgba(255,255,255,.75); color: #fff; padding: 9px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .pano-stage { width: 100%; height: 100%; position: relative; cursor: grab; touch-action: pan-y; }
    .pano-track { position: absolute; top: 0; left: 0; width: 780px; height: 224px; }
    .pano-hud { position: absolute; bottom: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; }
    .sticky-cta { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 12px 12px; z-index: 8; }

    /* Inputs & Modals */
    .input, .select, .textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; background: #fff; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--brand); }
    .textarea { resize: none; min-height: 70px; }
    .field-label { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }

    .overlay { position: absolute; inset: 0; background: rgba(15,23,42,.52); z-index: 40; display: none; flex-direction: column; justify-content: flex-end; }
    .overlay.open { display: flex; }
    .overlay.center { justify-content: center; align-items: center; padding: 16px; }
    .sheet { background: #fff; border-radius: 18px 18px 0 0; max-height: 85%; display: flex; flex-direction: column; overflow: hidden; }
    .modal-box { background: #fff; border-radius: 14px; width: 100%; max-height: 82%; display: flex; flex-direction: column; overflow: hidden; }
    .sheet-hd { padding: 12px 14px; border-bottom: 1px solid #F0F1F5; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
    .sheet-bd { padding: 12px 14px 16px; overflow-y: auto; }
    .toast { position: absolute; top: 82px; left: 50%; transform: translateX(-50%); z-index: 60; background: rgba(29,33,41,.92); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; max-width: 320px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
    .toast.err { background: rgba(220,38,38,.95); }
    .toast.ok { background: rgba(7,160,78,.95); }

    /* P4 Follow-up */
    .fu-group { display: flex; flex-direction: column; gap: 6px; }
    .fu-group .chips { overflow: visible; flex-wrap: wrap; }

    /* P5 Action Block */
    .action-block { background: #FFF4F3; border: 1px solid #FFD9D4; border-radius: 12px; padding: 12px; }
    .action-block.ok { background: var(--green-bg); border-color: #BAEACA; }
    .action-title { font-size: 14px; font-weight: 800; color: var(--red); }
    .action-block.ok .action-title { color: #009A29; }
    .todo-row { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 9px; padding: 8px 10px; margin-top: 8px; }
    .todo-name { font-weight: 600; font-size: 12.5px; }
    .todo-sub { font-size: 10.5px; color: var(--text-3); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .assign-select { width: 74px; padding: 4px 4px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-2); }
    .more-btn { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-app); border: 1px solid var(--border); color: var(--text-2); font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .member-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F2F3F5; }
    .member-row:last-child { border-bottom: none; }

    /* Poster */
    .poster-frame { background: linear-gradient(155deg,#0F2A5E,#1A56DB); border-radius: 12px; padding: 12px; color: #fff; }

    /* Screenshot Mode */
    body.shot-mode { background: #fff; }
    body.shot-mode .demo-bar { display: none; }
    .exit-shot { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 200; background: #1D2129; color: #fff; padding: 8px 14px; border-radius: 99px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    body.shot-mode .exit-shot { display: inline-flex; }
    body.shot-mode.flat { background: var(--bg-app); }
    body.shot-mode.flat .stage { padding: 0; }
    body.shot-mode.flat .phone { width: 390px; height: 780px; border: none; border-radius: 0; box-shadow: none; }
    body.shot-mode.flat .exit-shot { display: none; }
  </style>
</head>
<body>

  <!-- Top Reviewer Demo Bar -->
  <header class="demo-bar">
    <div class="demo-brand">
      <div class="demo-logo">酷</div>
      <div>
        <div style="font-weight:700;font-size:13px">酷家乐 · 大家居营销助手</div>
        <div style="font-size:10.5px;color:var(--text-3)">曾洪铭-广东工业大学2024级硕士 · 5屏可交互原型</div>
      </div>
    </div>
    <div class="demo-controls">
      <div class="seg" title="角色视角">
        <button class="seg-btn" id="r-sales" onclick="setRole('sales')">销售/导购 (小林)</button>
        <button class="seg-btn" id="r-owner" onclick="setRole('owner')">C端业主 (陈女士)</button>
        <button class="seg-btn" id="r-boss" onclick="setRole('boss')">老板/店长 (张总)</button>
      </div>
      <div class="seg ind-seg" title="业态切换">
        <button class="seg-btn" id="i-custom" onclick="setIndustry('custom')">定制家居门店 (默认)</button>
        <button class="seg-btn" id="i-deco" onclick="setIndustry('deco')">装修企业</button>
      </div>
      <div class="seg" title="快捷切屏">
        <button class="seg-btn" id="n-p1" onclick="go('p1')">①方案库</button>
        <button class="seg-btn" id="n-p2" onclick="go('p2')">②方案页</button>
        <button class="seg-btn" id="n-p3" onclick="go('p3')">③留资页</button>
        <button class="seg-btn" id="n-p4" onclick="go('p4')">④我的客户</button>
        <button class="seg-btn" id="n-p5" onclick="go('p5')">⑤团队概览</button>
      </div>
      <span style="font-size:10.5px;color:var(--text-3);white-space:nowrap">异常状态</span>
      <button class="anom-btn" id="a-empty" onclick="toggleAnom('emptyP1')">方案库空态</button>
      <button class="anom-btn" id="a-weak" onclick="toggleAnom('weakP2')">方案页弱网</button>
      <button class="anom-btn" id="a-noperm" onclick="triggerNoPerm()">团队无权限</button>
      <button class="anom-btn" id="a-cold" onclick="toggleCold()" title="正常状态：暂无数据时的推荐排序">冷启动期</button>
      <button class="shot-btn" onclick="toggleShot()">纯净截图模式</button>
    </div>
  </header>

  <button class="exit-shot" onclick="toggleShot()">✕ 退出截图模式</button>

  <!-- Centered Phone Frame -->
  <main class="stage">
    <div class="phone">
      <div class="wx-top">
        <div class="wx-status">
          <span>9:41</span>
          <span>5G · 98%</span>
        </div>
        <div class="wx-nav">
          <div id="wx-left" style="min-width:60px"></div>
          <div class="wx-title" id="wx-title">企业方案库</div>
          <div class="wx-capsule"><span>•••</span><span class="wx-cap-div"></span><span>◎</span></div>
        </div>
      </div>

      <div class="viewport" id="viewport"></div>

      <nav class="tabbar" id="tabbar">
        <button class="tab-btn" id="tb-p1" onclick="go('p1')"><span>🏠</span><span>方案库</span></button>
        <button class="tab-btn" id="tb-p4" onclick="go('p4')"><span>👥</span><span>我的客户</span><span class="tab-badge" id="bd-p4" style="display:none">0</span></button>
        <button class="tab-btn" id="tb-p5" onclick="go('p5')"><span>📊</span><span>团队概览</span><span class="tab-badge" id="bd-p5" style="display:none">0</span></button>
      </nav>

      <div class="toast" id="toast"></div>
      <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"></div>
    </div>
  </main>

  <script>
    /* ========================================================================
       Inline SVG Interior Illustrations & Dynamic QR Code
       ======================================================================== */
    function svgImg(type) {
      const m = {
        wardrobe: `<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="128" fill="#F4F0E8"/><rect y="128" width="360" height="32" fill="#D2B48C"/><rect x="26" y="14" width="218" height="114" fill="#FAF9F6" stroke="#D5CEC3"/><line x1="82" y1="14" x2="82" y2="128" stroke="#DDD6CC"/><line x1="138" y1="14" x2="138" y2="128" stroke="#DDD6CC"/><rect x="190" y="16" width="52" height="110" fill="#4E4237"/><rect x="192" y="18" width="48" height="4" fill="#FFE28A"/><line x1="190" y1="52" x2="242" y2="52" stroke="#D8B67A"/><line x1="190" y1="86" x2="242" y2="86" stroke="#D8B67A"/><rect x="272" y="96" width="60" height="32" rx="3" fill="#B58D63"/><circle cx="302" cy="70" r="7" fill="#FFF3C4" stroke="#D9A84E"/><line x1="302" y1="0" x2="302" y2="63" stroke="#555"/></svg>`,
        kitchen: `<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="126" fill="#EEF2F6"/><rect y="126" width="360" height="34" fill="#C7CFD9"/><rect x="24" y="12" width="228" height="46" fill="#E6EAEF" stroke="#C5CDD6"/><rect x="24" y="58" width="228" height="3" fill="#FFE89E"/><rect x="24" y="61" width="228" height="28" fill="#FFF"/><rect x="24" y="89" width="228" height="40" fill="#5D6775"/><rect x="260" y="12" width="76" height="117" fill="#4B5461"/><rect x="270" y="46" width="56" height="32" rx="3" fill="#1F242D" stroke="#8C96A5"/><rect x="86" y="110" width="160" height="38" rx="3" fill="#FFF" stroke="#D0D7E0"/></svg>`,
        entryway: `<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="128" fill="#F3EFE8"/><rect y="128" width="360" height="32" fill="#D5C7B6"/><rect x="30" y="14" width="234" height="114" fill="#EFECE6" stroke="#D2CBC0"/><rect x="92" y="54" width="114" height="34" fill="#B88E63"/><rect x="92" y="54" width="114" height="3" fill="#FFE89E"/><rect x="30" y="116" width="234" height="12" fill="#3D3833"/><rect x="264" y="14" width="64" height="114" fill="#C69D72"/><rect x="264" y="92" width="64" height="10" rx="2" fill="#6F5E50"/></svg>`,
        living: `<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="122" fill="#F2F4F7"/><rect y="122" width="360" height="38" fill="#D5CBC0"/><rect x="22" y="14" width="106" height="98" fill="#DCEBFF" stroke="#FFF" stroke-width="3"/><rect x="150" y="16" width="186" height="104" fill="#E6E2DC"/><rect x="182" y="30" width="120" height="62" rx="3" fill="#1D2129"/><rect x="160" y="100" width="166" height="16" rx="2" fill="#FFF"/><rect x="24" y="96" width="112" height="36" rx="6" fill="#7D8C9D"/><rect x="152" y="126" width="90" height="18" rx="3" fill="#FFF" stroke="#CCC"/></svg>`
      };
      return m[type] || m.wardrobe;

    function go(scr) {
      state.screen = scr;
      state.panoActive = false;
      if (scr === 'p2' || scr === 'p3') state.role = 'owner';
      else if (scr === 'p5' && state.role === 'owner') state.role = 'boss';
      else if ((scr === 'p1' || scr === 'p4') && state.role === 'owner') state.role = 'sales';
      render();
    }
    function toggleAnom(key) {
      state.anom[key] = !state.anom[key];
      if (key === 'emptyP1' && state.anom.emptyP1) { state.role = 'sales'; state.screen = 'p1'; }
      if (key === 'weakP2' && state.anom.weakP2) { state.role = 'owner'; state.screen = 'p2'; state.panoActive = false; }
      render();
    }

      state.anom.noPermP5 = !state.anom.noPermP5;

      if (state.coldStart) {

    function startPano(e) {
      const startX = e.touches ? e.touches[0].clientX : e.clientX;
      const orig = state.panoOffset;
      function move(ev) {
        const curX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        state.panoOffset = Math.max(-390, Math.min(0, orig + (curX - startX)));
        const tr = document.getElementById('pano-track');
        if (tr) tr.style.transform = `translateX(${state.panoOffset}px)`;
      }
      function end() {
        window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', end);
        window.removeEventListener('touchmove', move); window.removeEventListener('touchend', end);
      }
      window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      window.addEventListener('touchmove', move); window.addEventListener('touchend', end);
    }

    function submitLead(phone) {
      if (!/^1[3-9]\d{9}$/.test(phone)) { toast('请输入有效的 11 位手机号', 'err'); return; }
      if (phone === '13800138000') { toast('该号码暂不支持预约', 'err'); return; }
      const p = getPlan(state.selectedPlanId);
      const emp = getEmp(state.sharedByEmpId);
      const activeEmp = emp && emp.status === 'active' ? emp : null;
      if (state.p3Receipt) return;
      const previous = state.leads.find(l => l.ind === state.industry && l.phone === phone);
      const tags = state.inquiryMaterial ? ['询价',state.inquiryMaterial,...state.p3Tags] : [...state.p3Tags, state.industry === 'custom' ? '预约初尺' : '预约量房'];
      const source = activeEmp?.name || '门店';
      const eventText = [p.title,...tags,'来源：'+source].join(' · ');
      const newLead = {
        id: 'L' + Date.now(), ind: state.industry, name: '陈女士', phone,
        tags,
        planId: p.id, planTitle: p.title,
        ownerId: activeEmp ? activeEmp.id : null,
        status: '待处理', overdue: false,
        nextDate: addDays(state.industry === 'custom' ? 3 : 14),
        logs: [{ t: '刚刚', text: eventText, sys:true }]
      };
      let heatAgain = false;
      if (previous) {
        const owner = getEmp(previous.ownerId);
        const idleDays = previous.lastFollowDays == null ? 99 : previous.lastFollowDays;
        if (previous.status === '已结束') {
          Object.assign(previous,{status:'待处理',contacted:false,overdue:false,nextDate:newLead.nextDate,ownerId:newLead.ownerId});
          previous.logs.unshift({t:'刚刚',text:'重新咨询 · '+eventText,sys:true});
        } else if (!owner || owner.status !== 'active') {
          previous.ownerId = newLead.ownerId;
          previous.logs.unshift({t:'刚刚',text:'原负责人已不可用，线索转入待分配 · '+eventText,sys:true});
        } else if (idleDays > 7) {
          previous.ownerId = activeEmp ? activeEmp.id : previous.ownerId;
          previous.logs.unshift({t:'刚刚',text:'超 7 天未跟进，线索转交 '+source+' · '+eventText,sys:true});
        } else {
          heatAgain = true;
          previous.logs.unshift({t:'刚刚',text:'客户再次活跃 · '+eventText,sys:true});
        }
        Object.assign(previous,{planId:p.id,planTitle:p.title,tags});
      } else state.leads.unshift(newLead);
      p.leads7d += 1;
      if (activeEmp) activeEmp.leads += 1;
      state.p3Receipt = { phone, tags: newLead.tags, assignedTo: getEmp((previous || newLead).ownerId)?.name || null };
      toast(heatAgain ? '该客户已有顾问在跟，已提醒原负责人' : (state.inquiryMaterial ? '询价已提交' : '预约已提交'), 'ok');
      render();
    }

    }
    function submitLeadManual() {
      if (!/^1[3-9]\d{9}$/.test(state.p3Phone)) { toast('请输入有效的 11 位手机号', 'err'); return; }
      if (!state.p3CodeSent) { toast('请先获取短信验证码', 'err'); return; }
      if (!/^\d{6}$/.test(state.p3Code)) { toast('请输入 6 位短信验证码', 'err'); return; }
      if (state.p3Code !== '123456') { toast('验证码不正确', 'err'); return; }
      submitLead(state.p3Phone);
    }

    /* ========================================================================
       P4: Sales Leads & Follow-up
       ======================================================================== */
    function renderP4() {
      const isC = state.industry === 'custom';
      const tabs = isC ? ['全部','待处理','跟进中','已约初尺','已到店','已结束'] : ['全部','待处理','跟进中','已约量房','已看方案','已结束'];
      const emp = getEmp('emp1');
      if (!emp) return '<div class="pad"><div class="card">当前门店的员工账号已停用。</div></div>';
      const isFrozen = emp.status === 'frozen';
      const myLeads = state.leads.filter(l => l.ind === state.industry && l.ownerId === 'emp1');
      const filtered = state.p4Status === '全部' ? myLeads : myLeads.filter(l => l.status === state.p4Status);

      return `
        <div style="background:#fff;padding:8px 10px;border-bottom:1px solid var(--border)">
          <div class="chips">
            ${tabs.map(t => `<button class="chip ${state.p4Status===t?'active':''}" onclick="state.p4Status='${t}';render()">${t}</button>`).join('')}
          </div>
        </div>
        ${isFrozen ? `<div style="background:var(--red-bg);color:var(--red);padding:8px 12px;font-size:11.5px;font-weight:600">账号已冻结，只能查看，无法拨号与跟进</div>` : ''}
        <div class="pad stack">
          ${filtered.length === 0 ? `<div class="card" style="text-align:center;color:var(--text-3);padding:32px">这里还没有客户</div>` : ''}
          ${filtered.map(l => `
            <div class="card stack" style="gap:8px">
              <div class="between">
                <div class="row">
                  <span style="font-weight:700;font-size:14.5px">${l.name}</span>
                  <span style="font-size:12px;color:var(--text-2)">${mask(l.phone)}</span>
                </div>
                <span class="badge ${l.status==='待处理'?'b-red':(l.status==='已结束'?'b-gray':'b-blue')}">${l.status}</span>
              </div>
              <div class="row" style="flex-wrap:wrap;gap:5px">
                ${l.tags.map(t => `<span class="badge b-orange">${t}</span>`).join('')}
              </div>
              <div style="font-size:11.5px;color:var(--text-2);background:var(--bg-app);padding:6px 8px;border-radius:6px;line-height:1.5">
                看的方案：<strong>${htmlText(l.planTitle)}</strong>
              </div>
              ${l.trace ? `<div class="trace-box">👁 已授权浏览轨迹 · 看过 ${l.trace.sets} 套 · 最关注：${l.trace.focus}（停留 ${l.trace.dur}）</div>` : ''}
              <div style="font-size:11px;color:var(--text-3);line-height:1.5">
                ${l.logs[0].t} · ${htmlText(l.logs[0].text)}
                ${l.logs.length > 1 ? `<details><summary>查看历史记录</summary>${l.logs.slice(1).map(log=>`<p>${log.t} · ${htmlText(log.text)}</p>`).join('')}</details>` : ''}
                ${l.nextDate ? `<br/>下次提醒：${l.nextDate}` : ''}
              </div>
              <div class="row">
                <button class="btn btn-outline btn-sm" style="flex:1" ${isFrozen?'disabled':''} onclick="toast('正在拨打 ${mask(l.phone)}')">📞 打电话</button>
                <button class="btn btn-primary btn-sm" style="flex:1" ${isFrozen?'disabled':''} onclick="openFollowupModal('${l.id}')">✏️ 记跟进</button>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function openFollowupModal(leadId) {
      const l = state.leads.find(x => x.id === leadId);
      const isC = state.industry === 'custom';
      const opts = isC ? ['跟进中','已约初尺','已到店','已结束'] : ['跟进中','已约量房','已看方案','已结束'];
      const quick = isC ? ['已电话沟通','约到店看样','暂未接通','再发方案'] : ['已电话沟通','约量房时间','暂未接通','再发方案'];
      const defDays = isC ? 3 : 14;
      state.fuStatus = opts.includes(l.status) ? l.status : opts[0];
      state.fuLeadId = leadId;
      openModal(`
        <div class="sheet">
          <div class="sheet-hd"><span>记跟进 · ${l.name}</span><button onclick="closeModal()">✕</button></div>
          <div class="sheet-bd stack">
            <div class="fu-group">
              <div class="field-label">这次聊到哪一步？</div>
              <div class="chips">
                ${opts.map(o => `<button class="chip ${state.fuStatus===o?'active':''}" onclick="setFuStatus(this,'${o}')">${o}</button>`).join('')}
              </div>
            </div>
            <div class="fu-group">
              <div class="field-label">快捷记录</div>
              <div class="chips">
                ${quick.map(q => `<button class="chip q" onclick="fuQuick('${q}')">${q}</button>`).join('')}
              </div>
            </div>
            <div class="fu-group">
              <div class="field-label">备注（选填）</div>
              <select class="select" id="fu-outcome" aria-label="联系结果"><option value="">本次仅更新进度</option><option>已接通</option><option>未接通</option><option>已通过微信沟通</option></select><textarea class="textarea" id="fu-note" placeholder="想说点什么就写两句，不写也可以"></textarea>
            </div>
            <div class="fu-group">
              <div class="field-label">下次提醒</div>
              <input type="date" class="input" id="fu-date" value="${addDays(defDays)}" />
            </div>
            <button class="btn btn-primary btn-block" style="padding:10px" onclick="submitFollowup('${l.id}')">保存</button>
          </div>
        </div>
      `);
    }
    function setFuStatus(el, s) {
      state.fuStatus = s;
      Array.from(el.parentElement.children).forEach(c => c.classList.toggle('active', c === el));
    }
    function fuQuick(t) {
      if (t === '已电话沟通' || t === '暂未接通') document.getElementById('fu-outcome').value = t === '已电话沟通' ? '已接通' : '未接通';
      const ta = document.getElementById('fu-note');
      const cur = ta.value.trim();
      ta.value = cur ? cur.replace(/[；;]\s*$/, '') + '；' + t : t;
    }
    function submitFollowup(leadId) {
      const note = (document.getElementById('fu-note').value || '').trim();
      const dt = document.getElementById('fu-date').value;
      const st = state.fuStatus || '跟进中';
      const l = state.leads.find(x => x.id === leadId);
      const outcome = document.getElementById('fu-outcome').value;
      if (outcome) { l.contacted = true; l.overdue = false; }
      l.status = st;
      l.nextDate = st === '已结束' ? '' : dt;
      l.logs.unshift({ t: '刚刚', text: [st,outcome,note].filter(Boolean).join(' · '), sys: false });
      closeModal(); toast('已记下这次跟进', 'ok'); render();
    }

    /* ========================================================================
       P5: Boss / Manager Dashboard
       ======================================================================== */
    function renderP5() {
      if (state.anom.noPermP5 || state.role === 'sales') {
        return `
          <div class="pad" style="padding-top:64px">
            <div class="card" style="text-align:center;padding:34px 18px">
              <div style="font-size:38px;margin-bottom:10px">🔒</div>
              <div style="font-weight:700;font-size:15px;margin-bottom:6px">仅店长可查看</div>
              <div style="font-size:12px;color:var(--text-3);margin-bottom:18px">团队数据和线索分配需要店长权限。</div>
              <button class="btn btn-primary btn-sm" onclick="state.anom.noPermP5=false;go('p1')">返回方案库</button>
            </div>
          </div>`;
      }

      const indLeads = state.leads.filter(l => l.ind === state.industry);
      const unassigned = indLeads.filter(l => !l.ownerId && l.status !== '已结束');
      const overdue = indLeads.filter(l => l.overdue && l.ownerId && l.status !== '已结束');
      const awaiting = indLeads.filter(l=>l.ownerId && !l.contacted && l.status !== '已结束').length;
      const total = unassigned.length + overdue.length;
      const stage1 = state.industry === 'custom' ? '已约初尺' : '已约量房';
      const stage2 = state.industry === 'custom' ? '已到店' : '已看方案';
      const done1 = indLeads.filter(l => l.status === stage1).length;
      const done2 = indLeads.filter(l => l.status === stage2).length;

      const rows = [
        ...unassigned.map(l => ({ l, kind: 'new' })),
        ...overdue.map(l => ({ l, kind: 'late' }))
      ];

      const actionBlock = total === 0 ? `
        <div class="action-block ok">
          <div class="action-title">${awaiting ? `已全部分配，${awaiting} 条待首次联系` : '当前没有待分配或待首次联系的咨询'}</div>
          <div style="font-size:11.5px;color:#2F7D46;margin-top:4px">以员工登记的联系结果为准。</div>
        </div>` : `
        <div class="action-block">
          <div class="action-title">今天有 ${total} 条咨询待处理</div>
          <div style="font-size:11px;color:#B25000;margin-top:3px">${unassigned.length} 条待分配 · ${awaiting} 条已分配待首次联系 · ${overdue.length} 条超时</div>
          ${rows.map(({l, kind}) => `
            <div class="todo-row">
              <div style="flex:1;min-width:0">
                <div class="todo-name">${l.name} · ${mask(l.phone)}</div>
                <div class="todo-sub">${kind==='new' ? '未分配 · ' : '超 24 小时未跟进 · '}${htmlText(l.planTitle)}</div>
              </div>
              ${kind === 'new' ? `
                <select class="assign-select" onchange="assignLead('${l.id}', this.value)">
                  <option value="">指派 ▾</option>
                  ${teamMembers().filter(m=>m.status==='active').map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
                </select>` : `
                <button class="btn btn-sm" style="background:#fff;border:1px solid #FFD9D4;color:var(--red)" onclick="nudge('${l.id}')">提醒</button>`}
            </div>
          `).join('')}
        </div>`;

      return `
        <div class="pad stack">
          ${actionBlock}
          <div class="card">
            <div class="between" style="margin-bottom:2px">
              <span style="font-weight:700;font-size:13.5px">本周团队</span>
              <span style="font-size:10.5px;color:var(--text-3)">以员工登记的结果为准</span>
            </div>
            <div class="conv-row" style="margin-bottom:6px">
              <div><b>${done1}</b><span>${stage1}</span></div>
              <div><b>${done2}</b><span>${stage2}</span></div>
              <div><b>${awaiting}</b><span>待首次联系</span></div>
            </div>
            ${teamMembers().map(m => `
              <div class="member-row">
                <div class="row" style="gap:5px;min-width:0">
                  <span style="font-weight:600;font-size:12.5px">${m.name}</span>
                  ${m.uv === 0
                    ? '<span style="font-size:11px;color:var(--text-3)">· 未开始用</span>'
                    : `<span style="font-size:11.5px;color:var(--text-2)">· ${m.uv} 人看过 · ${m.leads} 条咨询</span>`}
                  ${m.status==='frozen' ? '<span class="badge b-gray">已冻结</span>' : ''}
                </div>
                <button class="more-btn" onclick="openMemberMenu('${m.id}')">⋯</button>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    function assignLead(leadId, empId) {
      if (!empId) return;
      const l = state.leads.find(x => x.id === leadId);
      const emp = getEmp(empId);
      l.ownerId = empId;
      l.logs.unshift({ t: '刚刚', text: `张总指派给 ${emp.name}`, sys: true });
      toast(`已指派给 ${emp.name}`, 'ok');
      render();
    }
    function nudge(leadId) {
      const l = state.leads.find(x => x.id === leadId);
      const emp = getEmp(l.ownerId);
      toast(`已提醒 ${emp ? emp.name : '负责人'} 尽快联系 ${l.name}`, 'ok');
    }
    function openMemberMenu(empId) {
      const m = getEmp(empId);
      const frozen = m.status === 'frozen';
      openModal(`
        <div class="sheet">
          <div class="sheet-hd"><span>成员管理 · ${m.name}</span><button onclick="closeModal()">✕</button></div>
          <div class="sheet-bd stack">
            <button class="btn btn-ghost btn-block" style="padding:10px" onclick="closeModal();toggleFreeze('${empId}')">
              ${frozen ? '解冻账号' : '冻结账号'}
            </button>
            <button class="btn btn-danger-out btn-block" style="padding:10px" onclick="openOffboard('${empId}')">
              移除成员（离职交接）
            </button>
          </div>
        </div>
      `);
    }
    function toggleFreeze(empId) {
      const m = getEmp(empId);
      m.status = m.status === 'frozen' ? 'active' : 'frozen';
      toast(m.status === 'frozen' ? `已冻结 ${m.name}：无法再分享，客户列表只读` : `已解冻 ${m.name}`, m.status==='frozen'?'err':'ok');
      render();
    }
    function openOffboard(empId) {
      const m = getEmp(empId);
      const activeLeads = state.leads.filter(l => l.ind === state.industry && l.ownerId === empId && l.status !== '已结束');
      if (activeLeads.length > 0) {
        const others = teamMembers().filter(x => x.id !== empId && x.status === 'active');
        openModal(`
          <div class="modal-box">
            <div class="sheet-hd"><span>离职前先交接客户</span><button onclick="closeModal()">✕</button></div>
            <div class="sheet-bd stack">
              <div style="font-size:12.5px;color:var(--text-2);line-height:1.6">
                <strong>${m.name}</strong> 手上还有 <strong style="color:var(--red)">${activeLeads.length} 个在跟客户</strong>，交接完才能移除。
              </div>
              <select class="select" id="ob-target">
                ${others.map(o => `<option value="${o.id}">全部交给：${o.name}</option>`).join('')}
                <option value="pool">全部退回待分配</option>
              </select>
              <button class="btn btn-danger btn-block" onclick="confirmOffboard('${empId}')">确认交接并移除</button>
            </div>
          </div>
        `, true);
      } else {
        state.members = state.members.filter(x => x.ind !== state.industry || x.id !== empId);
        closeModal(); toast(`已移除 ${m.name}`, 'ok'); render();
      }
    }
    function confirmOffboard(empId) {
      const target = document.getElementById('ob-target').value;
      const m = getEmp(empId);
      const targetEmp = target === 'pool' ? null : getEmp(target);
      state.leads.forEach(l => {
        if (l.ind === state.industry && l.ownerId === empId && l.status !== '已结束') {
          l.ownerId = targetEmp ? targetEmp.id : null;
          l.logs.unshift({ t: '刚刚', text: `原负责人 ${m.name} 离职，已交接给 ${targetEmp ? targetEmp.name : '待分配'}`, sys: true });
        }
      });
      state.members = state.members.filter(x => x.ind !== state.industry || x.id !== empId);
      closeModal(); toast(`已交接并移除 ${m.name}`, 'ok'); render();
    }

    state.members = ['custom','deco'].flatMap(ind => state.members.map(member => ({ ...member, ind })));
    state.leads.forEach(lead => { lead.contacted = lead.logs.some(log => !log.sys); });
    // 最近一次人工跟进距今天数，用于撞单时判断归属是否保留
    const IDLE_DAYS = { L102: 1, L105: 0, L106: 1, L201: 0, L203: 0 };
    state.leads.forEach(lead => { lead.lastFollowDays = IDLE_DAYS[lead.id] ?? null; });

    /* 启动参数：用于批量截图与深链。例：
       ?shot=1&screen=p2&role=owner&anom=weakP2
       ?shot=1&screen=p1&cold=1
       ?shot=1&screen=p4&modal=followup
       ?shot=1&screen=p1&modal=share&mode=poster            */
    function boot() {
      const q = new URLSearchParams(location.search);
      if (q.get('shot') === '1') document.body.classList.add('shot-mode', 'flat');
      if (q.get('ind')) {
        state.industry = q.get('ind');
        state.selectedPlanId = state.industry === 'custom' ? 'c1' : 'd1';
      }
      if (q.get('plan')) state.selectedPlanId = q.get('plan');
      if (q.get('screen')) {
        state.screen = q.get('screen');
        if (['p2','p3'].includes(state.screen)) state.role = 'owner';
        else if (state.screen === 'p5') state.role = 'boss';
        else state.role = 'sales';
      }
      if (q.get('role')) state.role = q.get('role');
      if (q.get('anom')) q.get('anom').split(',').forEach(k => { if (k in state.anom) state.anom[k] = true; });
      if (q.get('cold') === '1') state.coldStart = true;
      render();
      const m = q.get('modal');
      if (m === 'share') openShareModal(state.selectedPlanId, q.get('mode') || 'poster');
      else if (m === 'followup') openFollowupModal('L101');
      else if (m === 'member') openMemberMenu('emp2');
      else if (m === 'offboard') openOffboard('emp2');
      else if (m === 'sync') openSyncModal();
      else if (m === 'manual') { state.p3Manual = true; render(); }
    }

    boot();
  </script>
</body>
</html>
